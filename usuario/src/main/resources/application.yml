server:
  port: 8081

spring:
  application:
    name: usuario
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/usuarios}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

internal:
  # token compartilhado com o BFF (mínimo 32 caracteres); sem valor padrão de propósito
  token: ${INTERNAL_TOKEN}
