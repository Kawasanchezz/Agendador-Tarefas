server:
  port: 8080

spring:
  application:
    name: bff
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

services:
  usuario-url: ${USUARIO_URL:http://localhost:8081}
  tarefas-url: ${TAREFAS_URL:http://localhost:8082}
  viacep-url: ${VIACEP_URL:https://viacep.com.br/ws}

jwt:
  # obrigatório (mínimo 32 caracteres): sem valor padrão de propósito
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
